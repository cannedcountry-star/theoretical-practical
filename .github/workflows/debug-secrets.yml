name: debug-secrets

# 一時的な診断用。Secrets の「中身」は出力せず、文字数と
# 余計な記号が混ざっていないかだけを確認する。確認後に削除する。

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets の形を検査
        env:
          U: ${{ secrets.MAIL_USERNAME }}
          P: ${{ secrets.MAIL_PASSWORD }}
          T: ${{ secrets.MAIL_TO }}
        run: |
          inspect() {
            name="$1"; val="$2"; expect="$3"
            len=${#val}
            has_label=no
            case "$val" in *=*|*:*) has_label=yes;; esac
            has_space=no
            case "$val" in *" "*) has_space=yes;; esac
            has_ws=no
            printf '%s' "$val" | grep -qP '^\s|\s$' && has_ws=yes
            echo "$name : 文字数=$len (期待 $expect) / = か : を含む=$has_label / 空白を含む=$has_space / 前後に空白や改行=$has_ws"
          }
          inspect MAIL_USERNAME "$U" 23
          inspect MAIL_PASSWORD "$P" 16
          inspect MAIL_TO       "$T" 23
